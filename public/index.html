<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Noruf Security System - WebRTC P2P</title>
    <style>
        body { margin: 0; background: #000; }
        video { width: 100%; height: 100vh; object-fit: contain; }
    </style>
</head>
<body>
    <video id="webcam-video" autoplay playsinline muted></video>
    <script>
    const ws = new WebSocket(`wss://${window.location.host}`);
        // --- NUEVO: Keep-Alive para evitar que se cierre el WebSocket por inactividad ---
    setInterval(() => {
        if (ws.readyState === WebSocket.OPEN) {
            ws.send(JSON.stringify({ 
                type: 'ping',
                client_id: clientId 
            }));
        }
    }, 25000); // Se ejecuta cada 25 segundos
    
    // --- NUEVO: Generar ID único para este visor ---
    const clientId = Math.random().toString(36).substring(2, 15);
    
    const pc = new RTCPeerConnection({
        iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
    });
    
    const video = document.getElementById('webcam-video');

    // 1. Recibir video
    pc.ontrack = (event) => {
        console.log("¡Track de video recibido desde Python!");
        
        // Si aiortc mandó el stream bien, lo usamos. 
        // Si lo mandó vacío, creamos uno nosotros a la fuerza.
        if (event.streams && event.streams.length > 0) {
            video.srcObject = event.streams[0];
        } else {
            video.srcObject = new MediaStream([event.track]);
        }
        
        // Obligamos al navegador a darle Play por si las políticas de Autoplay lo bloquean
        video.play().catch(err => console.error("Error al reproducir el video:", err));
    };

    // 2. Enviar candidatos ICE
    pc.onicecandidate = (event) => {
        if (event.candidate) {
            ws.send(JSON.stringify({ 
                type: 'candidate', 
                client_id: clientId, // Enviar ID
                candidate: event.candidate 
            }));
        }
    };

    // 3. Iniciar la oferta cuando el WebSocket conecta
    ws.onopen = async () => {
        pc.addTransceiver('video', { direction: 'recvonly' });
        
        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);
        
        ws.send(JSON.stringify({ 
            type: 'offer', 
            client_id: clientId, // Enviar ID
            offer: { sdp: pc.localDescription.sdp, type: pc.localDescription.type } 
        }));
    };

    // 4. Manejar respuestas del servidor Python
    ws.onmessage = async (event) => {
        const data = JSON.parse(event.data);
        
        // --- NUEVO: Ignorar mensajes de otros clientes ---
        if (data.client_id && data.client_id !== clientId) return;
        
        if (data.type === 'answer') {
            await pc.setRemoteDescription(new RTCSessionDescription(data.answer));
        } else if (data.type === 'candidate' && data.candidate) {
            await pc.addIceCandidate(new RTCIceCandidate(data.candidate));
        }
    };
    </script>
</body>
</html>
