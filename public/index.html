<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Noruf Security System - WebRTC</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
        }
        
        .video-container {
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        video {
            width: 100%;
            height: 100%;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js"></script>
</head>
<body>
    <div class="video-container">
        <video id="webcam-video" autoplay muted></video>
    </div>

    <script>
        const SERVER_PEER_ID = 'noruf-security-server';
        const video = document.getElementById('webcam-video');
        
        // Conectar al servidor WebRTC
        const peer = new Peer(SERVER_PEER_ID);
        
        peer.on('open', (id) => {
            console.log('Mi Peer ID es:', id);
            
            // Crear conexión WebRTC
            const webSocket = new WebSocket(`wss://${window.location.host}/webrtc`);
            
            webSocket.onopen = () => {
                console.log('Conexión establecida');
                
                // Iniciar video desde el servidor
                startWebRTCStream();
            };
        });
        
        function startWebRTCStream() {
            const pc = new RTCPeerConnection();
            
            pc.onicecandidate = (e) => {
                if (e.candidate) {
                    ws.send(JSON.stringify(e.candidate));
                }
            };
            
            pc.ondatachannel = (e) => {
                const channel = e.channel;
                channel.ondata = (event) => {
                    const videoData = event.data;
                    video.srcObject = pc.getVideoTracks()[0];
                    video.play();
                };
            };
            
            // Solicitar descripción de oferta al servidor
            pc.createOffer()
                .then((offer) => {
                    ws.send(JSON.stringify(offer));
                })
                .catch((err) => console.error('Error creando oferta:', err));
        }
    </script>
</body>
</html>
